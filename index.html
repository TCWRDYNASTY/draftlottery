h1 {

button {

#start,

}

/* =========================================================

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

}

function setCommissionerInputsEnabled(enabled) {

   TEAM EDITOR
   ========================================================= */

function renderInputs() {
  inputs.innerHTML = "";

  teams.forEach(t => {
    const box = document.createElement("div");
    box.className = "team-edit";

    box.innerHTML = `

        data-id="${t.id}"

/* =========================================================
   LIVE TEAM EDITING
   ========================================================= */

});

/* =========================================================
   PERMANENT TEAM LABELS
   ========================================================= */

function renderPermanentLabels() {

  teams.forEach(team => {

/* =========================================================
   REFRESH RUNNER LABELS
   ========================================================= */
function refreshRunnerLabels() {
  runners.forEach(r => {

      image.alt = team.name;
    }
  });
}

/* =========================================================
   WEIGHTED DRAW
   ========================================================= */

function weightedPick(pool) {
  if (!pool.length) return null;

  const totalWeight = pool.reduce(
    (sum, team) => sum + Number(team.weight),
    0
  );

  let random = Math.random() * totalWeight;

  for (const team of pool) {
    random -= Number(team.weight);

    if (random <= 0) return team;
  }

  return pool[pool.length - 1];
}

/* =========================================================
   REVERSE-WEIGHTED DRAFT
   Picks #8 through #2 are drawn from the remaining teams.
   The last remaining team receives Pick #1.
   ========================================================= */

function createReverseDraftOrder() {
  let pool = teams.map(team => ({ ...team }));
  const order = [];

  for (let pick = teams.length; pick >= 2; pick--) {
    const winner = weightedPick(pool);

    if (!winner) break;

    order.push({
      pick,
      team: { ...winner }
    });

    pool = pool.filter(team => team.id !== winner.id);
  }

  if (pool.length === 1) {
    order.push({
      pick: 1,
      team: { ...pool[0] }
    });
  }

  return order;
}

/* =========================================================
   SUPABASE — LOAD TEAM CONFIGURATION
   ========================================================= */

async function loadDraftOrderFromSupabase() {
    console.log('Checking for saved draft order...');
    const { data, error } = await supabase

  const rows = teams.map(team => ({

/* =========================================================

  async function saveDraftOrderToSupabase(draftOrder) {

    const formattedData = draftOrder.map(pick => ({

/* =========================================================
   SUPABASE — LOAD DRAFT ORDER
   ========================================================= */

async function loadDraftOrderFromSupabase() {
  const { data, error } = await supabase
    .from(SUPABASE_ORDERS_TABLE_NAME)
    .select("id, order_data");

  if (error) {
    console.error("Supabase order load error:", error);
    showStatus("Could not load the saved draft order from Supabase.");
    return [];
  }

  if (!data || !data.length) {
    return [];
  }

  return data
    .map(row => {
      const d = row.order_data || {};
      const team = teams.find(t =>
        d.memberId != null
          ? Number(t.id) === Number(d.memberId)
          : t.name.trim().toLowerCase() ===
            String(d.member || "").trim().toLowerCase()
      );

      return {
        pick: Number(d.pick),

        team: team
          ? { ...team }
          : {
              id: d.memberId != null ? Number(d.memberId) : null,
              name: d.member || "Unknown",
              weight: 0,
              image: ""
            }
      };
    })
    .filter(item => Number.isInteger(item.pick) && item.pick > 0)
    .sort((a, b) => b.pick - a.pick);
}


/* =========================================================
   SUPABASE — RESET SAVED DRAFT
   ========================================================= */

async function clearDraftOrderFromSupabase() {

    .from(SUPABASE_ORDERS_TABLE_NAME)

  if (error) {

        onerror="

          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="player-image"
        style="
          display:none;
          align-items:center;
          justify-content:center;
          font-weight:900;
          color:#fff;
        "
      >
        ${escapeHTML(team.name.charAt(0).toUpperCase())}
      </div>
    `
    : `
      <div
        class="player-image"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          font-weight:900;
          color:#fff;
        "
      >
        ${escapeHTML(team.name.charAt(0).toUpperCase())}
      </div>
    `;

  el.innerHTML = `
    ${imageHTML}

    <div class="tag">
      ${escapeHTML(team.name)} • ${team.weight}%
    </div>
  `;

  field.appendChild(el);

  return el;
}

/* =========================================================
   RESET VISUALS
   ========================================================= */

function resetVisuals() {
  cancelAnimationFrame(raf);

  raceRunning = false;
  runners = [];

  field.querySelectorAll(".runner").forEach(el => el.remove());

  draftOrderList.innerHTML = "";

  showStatus("Ready at the starting line.");
}

/* =========================================================
   DISPLAY RESULTS
   ========================================================= */

function renderResults(order) {
  draftOrderList.innerHTML = "";

  // Display actual draft order: Pick #1 through Pick #8.
  const sorted = [...order].sort((a, b) => a.pick - b.pick);

  sorted.forEach(item => {
    const li = document.createElement("li");

    li.innerHTML = `
      <span>
        <strong>#${item.pick}</strong>
        ${escapeHTML(item.team.name)}
      </span>

      <span>
        ${item.team.weight}% odds
      </span>
    `;

    draftOrderList.appendChild(li);
  });
}

/* =========================================================
   START THE RACE
   ========================================================= */

async function start() {
  if (raceRunning) return;

  resetVisuals();

  raceRunning = true;

  showStatus("Drawing reverse odds — Pick #8 goes first...");
  const order = createReverseDraftOrder();

console.log("Number of teams:", teams.length);
console.log("Number of draft picks:", order.length);
console.log("Team IDs:", teams.map(t => t.id));
console.log("Draft picks:", order.map(o => ({
  pick: o.pick,
  teamId: o.team.id,
  teamName: o.team.name
})));

if (order.length !== teams.length) {
  raceRunning = false;
  showStatus(
    `Draft order incomplete: ${order.length} picks for ${teams.length} teams.`
  );
  return;
}

  savedDraftOrder = order.map(x => ({
    pick: x.pick,
    team: { ...x.team }
  }));

  const saved = await saveDraftOrderToSupabase(savedDraftOrder);

  if (!saved) {
    raceRunning = false;
    showStatus("Draft generated, but Supabase could not save it.");
    return;
  }
  runners = teams.map((team, index) => ({
    team: { ...team },
    el: addRunner(team, index),
    finish: 0,
    revealed: false
  }));

  const min = Math.min(...teams.map(t => t.weight));
  const max = Math.max(...teams.map(t => t.weight));
  order.forEach((item, rank) => {
    const runner = runners.find(r => r.team.id === item.team.id);

    if (!runner) return;

    const norm = max === min
      ? .5
      : (item.team.weight - min) / (max - min);

    const jitter = (Math.random() - .5) * 5000;

    runner.pick = item.pick;

    runner.finish = Math.max(
      4500,
      15000 + rank * 3500 - norm * 1800 + jitter
    );
  });

  const startTime = performance.now();

  function revealRunner(r) {
    if (r.revealed) return;

    r.revealed = true;
    r.el.classList.add("finished");

    const tag = r.el.querySelector(".tag");

    if (tag) {
      tag.innerHTML = `${escapeHTML(r.team.name)} • ${r.team.weight}%`;
    }
  }

  function frame(now) {
    const elapsed = now - startTime;

    runners.forEach(r => {
      const finishTime = Math.max(4500, r.finish);
      const target = Math.min(1, elapsed / finishTime);

      const eased =
        target < .18
          ? target * .65
          : target < .65
            ? .117 + (target - .18) * .93
            : .554 + (target - .65) * 1.28;

      const startPosition = 8;
      const finishPosition = 84;

      const currentPosition =
        startPosition +
        Math.min(
          finishPosition - startPosition,
          eased * (finishPosition - startPosition)
        );

      r.el.style.left = currentPosition + "%";

      if (elapsed >= finishTime) {
        r.el.style.left = "84%";
        revealRunner(r);
      }
    });

    if (runners.every(r => r.revealed)) {
      raceRunning = false;

      renderResults(savedDraftOrder);

      showStatus(
        "DRAFT ORDER COMPLETE — Pick #1 is the final team remaining."
      );

      return;
    }

    raf = requestAnimationFrame(frame);
  }

  raf = requestAnimationFrame(frame);
}

/* =========================================================
   LOAD SAVED RESULT
   ========================================================= */

function showSavedDraft() {
  if (!savedDraftOrder || !savedDraftOrder.length) return;

  resetVisuals();

  // Keep every image and label on the field.
  // Saved drafts display the runners at the finish line.
  runners = teams.map((team, index) => {
    const el = addRunner(team, index);

    el.style.left = "84%";
    el.classList.add("finished");

    return {
      team: { ...team },
      el,
      finish: 0,
      revealed: true
    };
  });

  renderResults(savedDraftOrder);

  showStatus("Saved draft loaded from Supabase.");
}

/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize() {
  showStatus("Loading draft configuration...");

  teams = await loadTeamsFromSupabase();

  renderInputs();
  renderPermanentLabels();

  savedDraftOrder = await loadDraftOrderFromSupabase();

  if (savedDraftOrder.length) {
    showSavedDraft();
  } else {
    showStatus("Ready at the starting line.");
  }
}

/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById("start").addEventListener("click", start);

document.getElementById("reset").addEventListener("click", () => {
  resetVisuals();

  showStatus("Ready at the starting line.");

  renderPermanentLabels();
});


commissionerLogin.addEventListener("click", openCommissionerLogin);

commissionerLoginForm.addEventListener("submit", event => {
  event.preventDefault();
  unlockCommissioner();
});

cancelCommissionerBtn.addEventListener("click", closeCommissionerLogin);


lockCommissionerBtn.addEventListener("click", lockCommissioner);

saveConfigBtn.addEventListener("click", saveConfiguration);

resetDraftBtn.addEventListener("click", async () => {
  const confirmed = window.confirm(
    "Reset the saved draft order in Supabase?"
  );

  if (!confirmed) return;

  const success = await clearDraftOrderFromSupabase();

  if (success) {
    resetVisuals();

    showStatus(
      "Saved draft cleared. Ready for a new reverse-odds draw."
    );
  }
});

/* =========================================================
   START
   ========================================================= */

initialize();
</script>
